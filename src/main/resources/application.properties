spring.application.name=gamehub-backend
server.port=8081

# Conexión a PostgreSQL (cambia el puerto/usuario/clave según tu PostgreSQL local o Supabase)
spring.datasource.url=jdbc:h2:mem:gamehubdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate: crea y actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CORS y JWT
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173}
app.jwt.secreto=${JWT_SECRETO:clave-secreta-gamehub-super-segura-2026-32bytes}
app.jwt.duracion-ms=3600000